name: Auto Update M3U Playlist

on:
  schedule:
    # Har 6 ghante me automatic chalega (CRON Schedule)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Direct manual trigger button bhi milega

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
            python-version: '3.x'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4

      - name: Run Scraping Script
        run: python scraper.py

      - name: Commit and Push Updated Playlist
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update M3U playlist" && git push)
